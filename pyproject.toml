[tool.poetry]
name = "ui-automation-solution"
version = "1.0.0"
description = "AI-powered UI test automation — 5-service POC"
authors = []
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Web framework (all services)
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
httpx = "^0.27"
python-dotenv = "^1.0"
aiofiles = "^24.0"

# Crawl service
crawl4ai = ">=0.4"
playwright = "^1.48"
beautifulsoup4 = "^4.12"
lxml = "^5.0"

# Planner service + Crawl AI
langchain = ">=1.0.0"               # Base framework for unified agents
langchain-openai = ">=0.3"
langgraph = ">=1.2.0,<2.0.0"        # Fixes the crash; includes ToolCallTransformer
langchain-core = ">=1.4"
langchain-mcp-adapters = ">=0.2.2"
openai = ">=1.0"
anthropic = ">=0.40"

# Planner + Executor
openpyxl = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
