[tool.poetry]
name = "crawl-service"
version = "1.0.0"
description = "Lambda-style crawl service — triggered by build complete"
authors = []
packages = []

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { version = "^0.32", extras = ["standard"] }
playwright = "^1.48"
firecrawl-py = "^1.0"
httpx = "^0.27"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
